import = [
	"~/.config/alacritty/catppuccin-frappe.toml"
#	"~/.config/alacritty/gruvbox_dark.toml"
]

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono NFM"
style = "Regular"

[font.bold]
family = "JetBrainsMono NFM"
style = "Bold"

[font.italic]
family = "JetBrainsMono NFM"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NFM"
style = "Bold Italic"

[window]
opacity = 0.65
