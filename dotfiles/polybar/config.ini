[bar/death]
font-0 = "JetBrainsMono NF Medium:style=Medium:size=12;3"
font-1 = "JetBrainsMono NF Medium:style=Medium:size=23;6"
font-2 = "JetBrainsMono NF Medium:style=Medium Italic:size=12;3"
bottom = true
fixed-center = true
width = 1342
height = 42
offset-x = 12
offset-y = 12
border-size = 2
line-size = 2
background = #1f1f2e
border-color = #79a2a2

modules-left = power-menu space greeter
modules-center = workspaces
modules-right = battery backlight volume wireless-con space date

[module/space]
type = custom/text
label = "      "

[module/power-menu]
type = custom/menu

label-close = " X "

label-open = "   "
label-open-foreground = #000000
label-open-background = #79a2a2

menu-0-0 = "  "
menu-0-0-exec = systemctl poweroff
menu-0-0-foreground = #cb6659

menu-0-1 = "  "
menu-0-1-exec = systemctl reboot
menu-0-1-foreground = #afc892

menu-0-2 = " 󰗽 "
menu-0-2-exec = bspc quit
menu-0-2-foreground = #66aeb7

[module/compositor]
type = custom/script
exec = b=$(pgrep -x compfy); [ -z "$b" ] && echo -e " \uf2d4 " || echo -e " \U000f10ac "
interval = 1
click-left = ~/.config/polybar/compfy.sh
label = %output%
label-foreground = #000000
label-background = #ffe69a

[module/wired-con]
type = internal/network
interface = enp2s0
interface-type = wired
interval = 3

label-connected = " 󰈁 "
label-connected-foreground = #000000
label-connected-background = #ffe69a

label-disconnected = " 󰈂 "
label-disconnected-foreground = #000000
label-disconnected-background = #ffe69a

format-packetloss = <animation-packetloss>
animation-packetloss-0 = " ! "
animation-packetloss-1 = "   "
animation-packetloss-2 = " 󰈁 "
animation-packetloss-framerate = 700

[module/wireless-con]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 3

label-disconnected = "%{A1:nmcli device connect wlp3s0:} 󰤮 OFF %{A}"
label-disconnected-foreground = #79a2a2

format-connected =" %{A1:nmcli device disconnect wlp3s0:}<ramp-signal> ON%{A}"
format-connected-foreground = #79a2a2

format-packetloss = "%{A1:nmcli device disconnect wlp3s0:}<animation-packetloss> ON%{A}"
format-packetloss-foreground = #79a2a2

ramp-signal-0 = " 󰤟"
ramp-signal-1 = " 󰤢"
ramp-signal-2 = " 󰤥"
ramp-signal-3 = " 󰤨"

animation-packetloss-0 = " 󰤫"
animation-packetloss-1 = "  "
animation-packetloss-framerate = 750

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
click-right = pavucontrol

label-muted = " 󰝟 OFF "
label-muted-foreground = #79a2a2

label-volume = "%percentage%% "

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = #79a2a2

ramp-volume-0 = " 󰕿"
ramp-volume-1 = " 󰖀"
ramp-volume-2 = " 󰕾"

[module/date]
type = internal/date
time = "%H:%M  "
date-alt = " %B %d, %Y"
label = "%date% %time%"
label-foreground = #91b6ba

[module/battery]
type = internal/battery
low-at = 20
battery = BAT0
adapter = AC0

label-charging = "󰂄 %percentage%%  "
label-charging-foreground = #ffe69a

label-discharging = "%percentage%%  "
label-full = "%percentage%%  "
label-low = "%percentage%%  "

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = #79a2a2

format-full = <ramp-capacity> <label-full>
format-full-foreground = #79a2a2

format-low = <animation-low> <label-low>
format-low-foreground = #79a2a2

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-framerate = 1000

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true

label = "%percentage%% "

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

format = <ramp> <label>
format-foreground = #79a2a2

[module/workspaces]
type = internal/bspwm
enable-click = true
enable-scroll = true

label-focused = " %index% "
label-focused-foreground = #79a2a2
label-focused-background = #303a3f
label-focused-underline = #79a2a2

label-occupied = " %index% "
label-occupied-foreground = #79a2a2

label-empty = " %index% "
label-empty-foreground = #6a6177

[module/greeter]
type = custom/script
exec = python -u ~/.config/polybar/greeter.py $(whoami)
tail = true
label = %output%
label-foreground = #79a2a2
