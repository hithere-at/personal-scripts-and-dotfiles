[bar/death]
font-0 = "JetBrainsMono NF Medium:style=Medium:size=12;3"
font-1 = "Noto Sans Mono:style=Regular:size=12;"
bottom = true
fixed-center = true
width = 1342
height = 42
offset-x = 12
offset-y = 12
border-size = 2
line-size = 2
background = #312F35
border-color = #CCBEFF

modules-left = power-menu space load
modules-center = workspaces
modules-right = battery backlight volume wireless-con space date

[module/space]
type = custom/text
label = "      "

[module/power-menu]
type = custom/menu

label-close = " X "

label-open = "   "
label-open-foreground = #33275E
label-open-background = #CCBEFF

menu-0-0 = "  "
menu-0-0-exec = systemctl poweroff
menu-0-0-foreground = #cb6659

menu-0-1 = "  "
menu-0-1-exec = systemctl reboot
menu-0-1-foreground = #afc892

menu-0-2 = " 󰗽 "
menu-0-2-exec = bspc quit
menu-0-2-foreground = #66aeb7

[module/wireless-con]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 3

label-disconnected = "%{A1:nmcli device connect wlp3s0:} 󰤮 OFF %{A}"
label-disconnected-foreground = #CCBEFF

format-connected =" %{A1:nmcli device disconnect wlp3s0:}<ramp-signal> ON%{A}"
format-connected-foreground = #CCBEFF

format-packetloss = "%{A1:nmcli device disconnect wlp3s0:}<animation-packetloss> ON%{A}"
format-packetloss-foreground = #CCBEFF

ramp-signal-0 = " 󰤟"
ramp-signal-1 = " 󰤢"
ramp-signal-2 = " 󰤥"
ramp-signal-3 = " 󰤨"

animation-packetloss-0 = " 󰤫"
animation-packetloss-1 = "  "
animation-packetloss-framerate = 750

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
click-right = pavucontrol

label-muted = " 󰝟 OFF "
label-muted-foreground = #CCBEFF

label-volume = "%percentage%% "

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = #CCBEFF

ramp-volume-0 = " 󰕿"
ramp-volume-1 = " 󰖀"
ramp-volume-2 = " 󰕾"

[module/date]
type = internal/date
time = "%H:%M  "
date-alt = " %B %d, %Y"
label = "%date% %time%"
label-foreground = #CCBEFF

[module/battery]
type = internal/battery
low-at = 20
battery = BAT0
adapter = AC0

label-charging = "󰂄 %percentage%%  "
label-charging-foreground = #EEB8CB

label-discharging = "%percentage%%  "
label-full = "%percentage%%  "
label-low = "%percentage%%  "

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = #CCBEFF

format-full = <ramp-capacity> <label-full>
format-full-foreground = #CCBEFF

format-low = <animation-low> <label-low>
format-low-foreground = #CCBEFF

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-framerate = 1000

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true

label = "%percentage%% "

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

format = <ramp> <label>
format-foreground = #CCBEFF

[module/workspaces]
type = internal/bspwm
enable-click = true
enable-scroll = true

label-focused = " %index% "
label-focused-foreground = #CCBEFF
label-focused-background = #494458
label-focused-underline = #CCBEFF

label-occupied = " %index% "
label-occupied-foreground = #CCBEFF

label-empty = " %index% "
label-empty-foreground = #6A6177

[module/load]
type = internal/cpu
interval = 1
format = <bar-load>

bar-load-width = 10
bar-load-indicator = ▮
bar-load-indicator-foreground = #CCBEFF

bar-load-fill = ▮
bar-load-fill-foreground = #EEB8CB

bar-load-empty = ▯
bar-load-empty-foreground = #CCBEFF
