[bar/main]
font-0 = "CaskaydiaMono NF:style=Regular:size=10;3"
bottom = false
fixed-center = true
width = 1354
height = 32
offset-x = 6
offset-y = 3
border-size = 2
radius = 8
background = #9a2f3033
border-color = #929090

modules-left = power-menu computer space space window-title
modules-center = workspaces
modules-right = battery stat-separator backlight stat-separator volume stat-separator wireless-con space space space date

[bar/misc]
font-0 = "JetBrainsMono NF:style=Medium:size=10;2"
font-1 = "Noto Sans Mono:style=Regular:size=10;0"
bottom = true
fixed-center = true
width = 362
height = 36
offset-x = 502
offset-y = 3
border-size = 2
radius = 8
background = #9a2f3033
border-color = #929090

modules-center = memory space cpu-load space swap

[module/space]
type = custom/text
label = "   "

[module/stat-separator]
type = custom/text
label = " / "
label-foreground = #929090

[module/power-menu]
type = custom/menu

label-close = " X "

label-open = "   "
label-open-foreground = #e2e2e5

menu-0-0 = "  "
menu-0-0-exec = systemctl poweroff
menu-0-0-foreground = #ccc4cb

menu-0-1 = "  "
menu-0-1-exec = systemctl reboot
menu-0-1-foreground = #e2e2e5

menu-0-2 = " 󰗽 "
menu-0-2-exec = bspc quit
menu-0-2-foreground = #bfc7d4

[module/window-title]
type = internal/xwindow
label = %title%
label-foreground = #e2e2e5
label-maxlen = 40

[module/computer]
type = custom/script
exec = echo "$(whoami)@$(uname -n)"
label = " : %output%"
label-foreground = #e2e2e5
interval = 120

[module/wireless-con]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 3

label-disconnected = "%{A1:nmcli device connect wlp3s0:} 󰤮 OFF %{A}"
label-disconnected-foreground = #e2e2e5

format-connected =" %{A1:nmcli device disconnect wlp3s0:}<ramp-signal> ON%{A}"
format-connected-foreground = #e2e2e5

format-packetloss = "%{A1:nmcli device disconnect wlp3s0:}<animation-packetloss> ON%{A}"
format-packetloss-foreground = #e2e2e5

ramp-signal-0 = " 󰤟"
ramp-signal-1 = " 󰤢"
ramp-signal-2 = " 󰤥"
ramp-signal-3 = " 󰤨"

animation-packetloss-0 = " 󰤫"
animation-packetloss-1 = "  "
animation-packetloss-framerate = 750

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
click-right = pavucontrol

label-muted = " 󰝟 OFF "
label-muted-foreground = #e2e2e5

label-volume = "%percentage%% "

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = #e2e2e5

ramp-volume-0 = " 󰕿"
ramp-volume-1 = " 󰖀"
ramp-volume-2 = " 󰕾"

[module/date]
type = internal/date
time = "%H:%M  "
date-alt = " %B %d, %Y  "
label = "%date% %time%"
label-foreground = #e2e2e5

[module/battery]
type = internal/battery
low-at = 10
battery = BAT0
adapter = AC0

label-charging = "󰂄 %percentage%% "
label-charging-foreground = #bfc7d4

label-discharging = "%percentage%% "
label-full = "%percentage%% "
label-low = "%percentage%% "

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = #e2e2e5

format-full = <ramp-capacity> <label-full>
format-full-foreground = #e2e2e5

format-low = <animation-low> <label-low>
format-low-foreground = #c6c6e9

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-framerate = 1000

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true

label = "%percentage%% "

ramp-0 = " 󰃞"
ramp-1 = " 󰃟"
ramp-2 = " 󰃠"

format = <ramp> <label>
format-foreground = #e2e2e5

[module/workspaces]
type = internal/bspwm
enable-click = true
enable-scroll = true

label-focused = " ● "
label-focused-foreground = #e2e2e5

label-occupied = " ○ "
label-occupied-foreground = #e2e2e5

label-empty = " ○ "
label-empty-foreground = #3c3b3c

[module/memory]
type = internal/memory
internal = 5
label = "   %gb_used%"
label-foreground = #e2e2e5

[module/swap]
type = internal/memory
interval = 5
label = "  %gb_swap_used% "
label-foreground = #e2e2e5

[module/cpu-load]
type = internal/cpu
interval = 1
format = <bar-load>

bar-load-width = 10
bar-load-indicator = ▮
bar-load-indicator-foreground = #bfc7d4

bar-load-fill = ▮
bar-load-fill-foreground = #e2e2e5

bar-load-empty = ▯
bar-load-empty-foreground = #bfc7d4

