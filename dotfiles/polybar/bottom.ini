[settings]
pseudo-transparency = true

[bar/death]
font-0 = "JetBrainsMono NF Medium:style=Medium:size=11;2"
font-1 = "JetBrainsMono NF Medium:style=Medium:size=23;6"
bottom = true
fixed-center = true
background = #00000000
modules-left = rounded-left-light shutdown restart logout compositor wireless-con wired-con bluetooth volume rounded-right-light
modules-center = rounded-left-dark cpu memory rounded-right-dark space rounded-left-dark cava rounded-right-dark space rounded-left-dark battery backlight rounded-right-dark
modules-right = rounded-left-light date rounded-right-light
width = 1342
height = 40
offset-x = 12
offset-y = 12

[module/space]
type = custom/text
label = " "

[module/rounded-left-light]
type = custom/text
label = ""
label-font = 2
label-foreground = #ffe69a

[module/rounded-left-dark]
type = custom/text
label = ""
label-font = 2
label-foreground = #30283c

[module/rounded-right-light]
type = custom/text
label = ""
label-font = 2
label-foreground = #ffe69a

[module/rounded-right-dark]
type = custom/text
label = ""
label-font = 2
label-foreground = #30283c

[module/shutdown]
type = custom/text
label = " " 
label-foreground = #000000
label-background = #ffe69a
click-left = systemctl poweroff

[module/restart]
type = custom/text
label = "  " 
label-foreground = #000000
label-background = #ffe69a
click-left = systemctl reboot

[module/logout]
type = custom/text
label = " 󰗽 " 
label-foreground = #000000
label-background = #ffe69a
click-left = bspc quit

[module/compositor]
type = custom/script
exec = b=$(pgrep -x compfy); [ -z "$b" ] && echo -e " \uf2d4 " || echo -e " \U000f10ac "
interval = 1
click-left = ~/.config/polybar/compfy.sh
label = %output%
label-foreground = #000000
label-background = #ffe69a

[module/bluetooth]
type = custom/script
exec = bt_status=$(bluetoothctl show | grep Powered | grep -o "yes\|no"); [ "$bt_status" = "yes" ] && echo -e " \U000f00af " || echo -e " \U000f00b2 "
interval = 3
click-left = ~/.config/polybar/bt.sh
click-right = QT_QPA_PLATFORMTHEME=qt6ct bluedevil-wizard
label = %output%
label-foreground = #000000
label-background = #ffe69a

[module/wired-con]
type = internal/network
interface = enp2s0
interface-type = wired
interval = 3

label-connected = " 󰈁 "
label-connected-foreground = #000000
label-connected-background = #ffe69a

label-disconnected = " 󰈂 "
label-disconnected-foreground = #000000
label-disconnected-background = #ffe69a

format-packetloss = <animation-packetloss>
animation-packetloss-0 = " ! "
animation-packetloss-1 = "   "
animation-packetloss-2 = " 󰈁 "
animation-packetloss-framerate = 700

[module/wireless-con]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 3

label-disconnected = "%{A1:nmcli device connect wlp3s0:} 󰤮 %{A}"
label-disconnected-foreground = #000000
label-disconnected-background = #ffe69a

format-connected = %{A1:nmcli device disconnect wlp3s0:}<ramp-signal>%{A}
format-connected-foreground = #000000
format-connected-background = #ffe69a

format-packetloss = %{A1:nmcli device disconnect wlp3s0:}<animation-packetloss>%{A}
format-packetloss-foreground = #000000
format-packetloss-background = #ffe69a

ramp-signal-0 = " 󰤟 "
ramp-signal-1 = " 󰤢 "
ramp-signal-2 = " 󰤥 "
ramp-signal-3 = " 󰤨 "

animation-packetloss-0 = " 󰤫 "
animation-packetloss-1 = "   "
animation-packetloss-framerate = 750

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5

label-muted = " 󰝟 "
label-muted-foreground = #000000
label-muted-background = #ffe69a

format-volume = <ramp-volume>
format-volume-foreground = #000000
format-volume-background = #ffe69a

ramp-volume-0 = " 󰕿 " 
ramp-volume-1 = " 󰖀 " 
ramp-volume-2 = " 󰕾 " 

[module/date]
type = internal/date
time = "%H:%M "
date-alt = " %B %d, %Y"
label = " %date% %time%"
label-foreground = #000000
label-background = #ffe69a

[module/cava]
type = custom/script
exec = ~/.config/polybar/info-cava.py -f 24 -b 18 -c stereo
tail = true
label = %output%
label-foreground = #ffe69a
label-background = #30283c

[module/cpu]
type = internal/cpu
interval = 3
warn-percentage = 90
label = " %percentage%% "
label-foreground = #ffe69a
label-background = #30283c
label-warn = " %percentage% "
label-warn-foreground = #ffc287
label-warn-background = #30283c

[module/memory]
type = internal/memory
interval = 5
label = "  %percentage_used%%"
label-foreground = #ffe69a
label-background = #30283c

[module/battery]
type = internal/battery
low-at = 20
battery = BAT0
adapter = AC0

label-charging = "󰂄 %percentage%%  "
label-charging-foreground = #ffe69a
label-charging-background = #30283c

label-discharging = "%percentage%%  "
label-full = "%percentage%% "
label-low = "%percentage%%  "

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = #ffe69a
format-discharging-background = #30283c

format-full = <ramp-capacity> <label-full>
format-full-foreground = #ffe69a
format-full-background = #30283c

format-low = <animation-low> <label-low>
format-low-foreground = #ffe69a
format-low-background = #30283c

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-framerate = 1000

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true

label = "%percentage%%"

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

format = <ramp> <label>
format-foreground = #ffe69a
format-background = #30283c
