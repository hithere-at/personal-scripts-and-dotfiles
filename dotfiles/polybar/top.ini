[settings]
pseudo-transparency = true

[bar/alive]
font-0 = "JetBrainsMono NF Medium:style=Medium:size=11;2"
font-1 = "JetBrainsMono NF Medium:style=Medium:size=23;6"
font-2 = "Noto Sans CJK JP:style=Regular;2"
fixed-center = true
background = #00000000
underline-size = 3
modules-left = rounded-left-light song rounded-right-light
modules-center = rounded-left-dark workspaces rounded-right-dark
modules-right = rounded-left-dark systray rounded-right-dark
width = 1342
height = 40
offset-x = 12
offset-y = 12

[module/rounded-left-light]
type = custom/text
label = ""
label-font = 2
label-foreground = #ffe69a

[module/rounded-left-dark]
type = custom/text
label = ""
label-font = 2
label-foreground = #30283c

[module/rounded-right-light]
type = custom/text
label = ""
label-font = 2
label-foreground = #ffe69a

[module/rounded-right-dark]
type = custom/text
label = ""
label-font = 2
label-foreground = #30283c

[module/workspaces]
type = internal/bspwm
enable-click = true
enable-scroll = true

label-focused = " %index% "
label-focused-foreground = #ffe69a
label-focused-background = #3e344d
label-focused-underline = #ffe69a

label-occupied = " %index% "
label-occupied-foreground = #ffe69a
label-occupied-background = #30283c

label-empty = " %index% "
label-empty-foreground = #6a6177
label-empty-background = #30283c

[module/song]
type = custom/script
exec = player_stat=$(playerctl metadata title 2> /dev/null); [ -z "$player_stat" ] && echo -e "\U000f075b  Idling..." || echo -e "\uf001  $player_stat"
interval = 1
label = "%output%"
label-foreground = #000000
label-background = #ffe69a

[module/systray]
type = internal/tray
format = <tray>
format-background = #30283c
tray-spacing = 3px
tray-background = #30283c
tray-foreground = #ffe69a
